<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F1E7" />
    <link rel="icon" href="/logos/pango-icono-app-marca-oscuro.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          const m = localStorage.getItem('pango-theme');
          const dark =
            m === 'dark' ||
            (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          const r = document.documentElement;
          if (dark) r.classList.add('dark');
          r.style.colorScheme = dark ? 'dark' : 'light';
          const t = document.querySelector('meta[name="theme-color"]');
          if (t && dark) t.setAttribute('content', '#111814');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@200;300;400;500;600;700;800;900&family=Work+Sans:wght@200;300;400;500;600;700;800;900&family=Nunito:wght@200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Pango</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
